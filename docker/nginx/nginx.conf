# Reverse proxy for the Docker Compose stack.
#
# Django (Gunicorn + WhiteNoise) serves the API, SPA and static files.
# nginx serves uploaded media directly from the shared volume and forwards
# everything else to Django.

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 6m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    upstream django {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Container health check.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Uploaded files (profile images) are written by Django to the shared
        # volume and served by nginx for performance.
        location /media/ {
            # The media volume is mounted at /var/www/media, so root + the
            # request URI (/media/...) maps directly to the stored file.
            root /var/www;
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=86400";
            default_type application/octet-stream;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/webp webp;
            }
        }

        location / {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Keep the port so Django builds correct absolute media URLs
            # (e.g. http://localhost:8080/media/...).
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
