apiVersion: v1
kind: Service
metadata:
  name: school-erp-postgres
  namespace: school-erp
  labels:
    app.kubernetes.io/name: school-erp
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: school-erp
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
