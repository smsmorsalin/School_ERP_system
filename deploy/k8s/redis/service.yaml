apiVersion: v1
kind: Service
metadata:
  name: school-erp-redis
  namespace: school-erp
  labels:
    app.kubernetes.io/name: school-erp
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: school-erp
    app.kubernetes.io/component: cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
