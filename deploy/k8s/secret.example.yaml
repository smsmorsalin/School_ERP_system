# EXAMPLE ONLY — do not commit real secrets.
#
#   cp secret.example.yaml secret.yaml
#   # edit every REPLACE_ME value
#   kubectl create namespace school-erp
#   kubectl apply -f secret.yaml
#
# Or create it imperatively:
#
#   kubectl -n school-erp create secret generic school-erp-secrets \
#     --from-literal=SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')" \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=POSTGRES_PASSWORD='...'
#
# `secret.yaml` is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: school-erp-secrets
  namespace: school-erp
  labels:
    app.kubernetes.io/name: school-erp
type: Opaque
stringData:
  # Django: at least 50 characters, unique per environment.
  SECRET_KEY: "REPLACE_ME_WITH_AT_LEAST_50_RANDOM_CHARACTERS"
  # Application database password.
  DB_PASSWORD: "REPLACE_ME_STRONG_DB_PASSWORD"
  # PostgreSQL container password (keep identical to DB_PASSWORD).
  POSTGRES_PASSWORD: "REPLACE_ME_STRONG_DB_PASSWORD"

  # Optional SMTP credentials (set EMAIL_BACKEND to SMTP in the ConfigMap).
  EMAIL_HOST: ""
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""

  # Online fee payments — live mode only.
  # Generate PAYMENT_WEBHOOK_SECRET with:
  #   python -c "import secrets; print(secrets.token_urlsafe(48))"
  # It must be at least 32 characters. Keep the same value configured with
  # every payment provider so their HMAC-SHA256 signatures verify.
  PAYMENT_WEBHOOK_SECRET: "REPLACE_ME_WITH_AT_LEAST_32_RANDOM_CHARACTERS"
  # HTTPS hosted-checkout endpoint supplied by your payment partner.
  PAYMENT_LIVE_CHECKOUT_BASE: ""
